name: Desktop Agent Brain Core CI

on:
  push:
    branches:
      - feature/apluscity-desktop-agent
    paths:
      - "desktop-agent/**"
      - ".github/workflows/desktop-agent-brain-ci.yml"
  pull_request:
    branches:
      - feature/apluscity-desktop-agent
    paths:
      - "desktop-agent/**"
      - ".github/workflows/desktop-agent-brain-ci.yml"

jobs:
  brain-core-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          for file in *.cjs *.js brain/*.cjs; do
            node --check "$file"
          done
      - name: Check Windows agent Python syntax
        run: python3 -m py_compile windows-agent/agent_service.py
      - run: npm test
