<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f9ff">
<meta name="description" content="AplusCity Companion — your private AI companion.">
<title>AplusCity Companion</title>
<link rel="manifest" href="/companion-manifest.json">
<style>
:root{color-scheme:light;--ink:#202020;--muted:#77736f;--blue:#b9232d;--pale:#fff0ed;--line:#ece7e2;--surface:#fff;--mint:#edf6ed}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#fffaf7;color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}body{overflow:hidden}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}.app{width:100%;height:100%;height:100dvh;max-width:560px;margin:0 auto;background:var(--surface);display:flex;flex-direction:column;overflow:hidden;position:relative}.safe-top{padding-top:env(safe-area-inset-top)}.safe-bottom{padding-bottom:env(safe-area-inset-bottom)}.topbar{height:66px;flex-shrink:0;display:flex;align-items:center;gap:11px;padding:10px 18px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.96)}.logo{width:38px;height:38px;border-radius:14px;background:linear-gradient(145deg,#202020,#b9232d);color:white;display:grid;place-items:center;font-size:22px;font-weight:800;box-shadow:0 4px 12px #b9232d22}.brand{font-weight:750;letter-spacing:-.03em}.subtitle{font-size:12px;color:var(--muted);margin-top:1px}.spacer{flex:1}.icon-btn{border:0;background:transparent;color:var(--ink);font-size:22px;padding:8px;border-radius:12px}.view{flex:1;min-height:0;display:flex;flex-direction:column}.auth-view{overflow:auto;padding:28px 24px 34px;background:radial-gradient(ellipse at 10% 0,#fff0ed 0,transparent 42%),radial-gradient(ellipse at 95% 35%,#f5eee9 0,transparent 35%),#fff}.welcome-mark{width:74px;height:74px;margin:8px auto 18px;border-radius:26px;background:linear-gradient(145deg,#c9dcff,#4776ff);display:grid;place-items:center;color:#fff;font-size:40px;box-shadow:0 15px 35px #b9232d30}.auth-view h1{text-align:center;font-size:29px;line-height:1.15;letter-spacing:-.045em;margin:0 0 9px}.lead{text-align:center;color:var(--muted);margin:0 auto 27px;max-width:300px;font-size:14px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#eef2fa;padding:5px;border-radius:14px;margin-bottom:20px}.tab{border:0;background:transparent;border-radius:10px;padding:10px 6px;color:#657391;font-weight:650;font-size:14px}.tab.active{background:#fff;color:var(--ink);box-shadow:0 2px 7px #15265012}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:13px;font-weight:650;color:#455578}.field input{width:100%;border:1px solid #e8ddd6;background:#fff;border-radius:14px;padding:15px 14px;color:var(--ink);outline:none;min-height:52px}.field input:focus{border-color:#cf777b;box-shadow:0 0 0 3px #b9232d12}.primary,.secondary{width:100%;border-radius:15px;padding:14px 16px;min-height:52px;font-weight:700;border:0}.primary{background:linear-gradient(100deg,#4278ff,#991b24);color:white;box-shadow:0 8px 18px #b9232d26}.secondary{background:#fff;border:1px solid #e8ddd6;color:var(--ink)}.form-actions{display:grid;gap:10px;margin-top:20px}.hint{font-size:12px;color:var(--muted);text-align:center;margin:17px auto 0;max-width:320px}.status{min-height:22px;margin-top:12px;color:#52699b;font-size:13px;text-align:center;overflow-wrap:anywhere}.code-box{display:flex;align-items:center;gap:8px;background:#fff0ed;border-radius:14px;padding:13px 12px;margin:14px 0;color:var(--ink)}.code-value{font-size:17px;font-weight:800;letter-spacing:.04em;overflow-wrap:anywhere;flex:1}.copy{border:0;border-radius:10px;background:#fff;padding:9px 10px;color:#991b24;font-weight:700}.privacy{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:26px;color:#7a88a7;font-size:12px}.chat-view{background:#fbfcff}.chat-scroll{flex:1;min-height:0;overflow:auto;padding:18px 15px 20px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}.bubble{max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere;padding:12px 15px;border-radius:19px;font-size:15px;line-height:1.55}.bubble.ai{align-self:flex-start;background:#f0f4fb;border:1px solid #e9eef8;border-bottom-left-radius:6px;color:#1e2e55}.bubble.user{align-self:flex-end;background:linear-gradient(120deg,#c42d37,#a91f29);color:white;border-bottom-right-radius:6px;box-shadow:0 5px 14px #b9232d18}.typing{display:flex;gap:5px;align-items:center;color:#8190ad}.typing span{width:5px;height:5px;border-radius:50%;background:#8295bb;animation:pulse 1s infinite alternate}.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}@keyframes pulse{to{opacity:.25;transform:translateY(-2px)}}.composer-wrap{padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff;flex-shrink:0}.composer{display:flex;align-items:flex-end;gap:8px;padding:6px 6px 6px 13px;border:1px solid #e4eaf5;background:#fffaf7;border-radius:24px}.composer textarea{flex:1;min-width:0;max-height:120px;resize:none;border:0;outline:none;background:transparent;color:var(--ink);padding:8px 0;line-height:1.45;font-size:15px}.send{width:42px;height:42px;flex-shrink:0;border:0;border-radius:50%;background:var(--blue);color:#fff;font-size:21px;display:grid;place-items:center}.chat-status{font-size:11px;color:var(--muted);text-align:center;min-height:15px;padding-top:4px}.hidden{display:none!important}.account-sheet{position:absolute;z-index:5;inset:0;background:#14203b66;display:flex;justify-content:flex-end;flex-direction:column}.sheet{background:white;border-radius:24px 24px 0 0;padding:24px 22px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px #14203b20}.sheet h2{margin:0 0 8px}.sheet p{font-size:13px;color:var(--muted)}.sheet-btn{margin-top:9px}.toast{font-size:13px;color:#5370a8;text-align:center;padding:6px}
@media(min-width:561px){body{background:#eaf0fa;display:grid;place-items:center}.app{height:min(900px,100dvh);border-radius:28px;box-shadow:0 20px 70px #1c2b4b20}.topbar{border-radius:28px 28px 0 0}}
</style>
</head>
<body>
<div class="app">
<header class="topbar safe-top"><div class="logo">AC</div><div><div class="brand">AplusCity Companion</div><div class="subtitle" id="top-subtitle">A private space to feel heard</div></div><div class="spacer"></div><button class="icon-btn hidden" id="account-button" aria-label="Account and privacy">☰</button></header>
<section class="view auth-view" id="auth-view">
<div class="welcome-mark">AC</div><h1 id="auth-title">欢迎来到你的私人空间</h1><p class="lead" id="auth-lead">你的陪伴，你的记忆，你的节奏。使用专属 Memory Code 安全登录。</p>
<div class="tabs"><button class="tab active" id="login-tab" type="button">登录</button><button class="tab" id="register-tab" type="button">创建 Memory Code</button></div>
<div id="login-fields"><div class="field"><label for="login-code">Memory code</label><input id="login-code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="AC-XXXX-XXXX-XXXX"></div><div class="field"><label for="login-pin">私人 PIN</label><input id="login-pin" type="password" autocomplete="current-password" placeholder="请输入 PIN（至少 8 位）"></div><div class="form-actions"><button class="primary" id="login-button" type="button">进入我的空间</button></div></div>
<div id="register-fields" class="hidden"><p style="font-size:13px;color:#7583a4;margin:0 0 8px">先创建专属 Memory Code 并妥善保存，它是进入私人空间的凭证。</p><div class="code-box"><div class="code-value" id="new-code">点击“生成代码”</div><button class="copy" id="generate-code" type="button">生成</button></div><button class="secondary" id="copy-code" type="button">复制 Memory Code</button><div class="field"><label for="register-pin">创建私人 PIN</label><input id="register-pin" type="password" autocomplete="new-password" minlength="8" placeholder="至少 8 位字符"></div><div class="field"><label for="register-pin-confirm">确认 PIN</label><input id="register-pin-confirm" type="password" autocomplete="new-password" minlength="8" placeholder="再次输入 PIN"></div><div class="form-actions"><button class="primary" id="register-button" type="button">创建我的私人空间</button></div></div>
<div class="status" id="auth-status" role="status" aria-live="polite"></div><div class="privacy">♡ 你的记忆属于你 · 隐私优先</div>
</section>
<section class="view chat-view hidden" id="chat-view">
<div class="chat-scroll" id="messages" aria-live="polite"><div class="bubble ai">你好，很高兴你来了。今天有什么想聊聊的？</div></div>
<div class="composer-wrap"><form class="composer" id="chat-form"><textarea id="message" rows="1" maxlength="3000" required placeholder="和我说说你的想法……"></textarea><button class="send" id="send" type="submit" aria-label="Send message">➤</button></form><div class="chat-status" id="chat-status">Enter 发送 · Shift + Enter 换行</div></div>
</section>
<div class="account-sheet hidden" id="account-sheet"><div class="sheet"><div style="display:flex;align-items:center;gap:10px"><div class="logo">AC</div><div><h2>我的私人空间</h2><div class="subtitle" id="account-code"></div></div></div><p>你的聊天记录和已保存的记忆保存在私人账户中。退出登录不会删除它们。</p><button class="secondary sheet-btn" id="close-sheet" type="button">返回聊天</button><button class="primary sheet-btn" id="signout" type="button">退出登录</button></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
const $=id=>document.getElementById(id);let client=null,session=null,busy=false,generatedCode='';
const authView=$('auth-view'),chatView=$('chat-view'),authStatus=$('auth-status'),chatStatus=$('chat-status');
function normalizeCode(v){return String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'')}
function emailForCode(code){return normalizeCode(code).toLowerCase()+'@memory.apluscity.invalid'}
function validCode(v){return normalizeCode(v).length===14&&normalizeCode(v).startsWith('AC')}
function generate(){const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',bytes=new Uint8Array(12);crypto.getRandomValues(bytes);let raw='';for(const b of bytes)raw+=alphabet[b%alphabet.length];generatedCode='AC-'+raw.slice(0,4)+'-'+raw.slice(4,8)+'-'+raw.slice(8,12);$('new-code').textContent=generatedCode;$('login-code').value=generatedCode;$('auth-status').textContent='代码已生成。请先复制并保存，再设置私人 PIN。'}
function setTab(which){const login=which==='login';$('login-fields').classList.toggle('hidden',!login);$('register-fields').classList.toggle('hidden',login);$('login-tab').classList.toggle('active',login);$('register-tab').classList.toggle('active',!login);$('auth-title').textContent=login?'Welcome back.':'A private space, made for you.';$('auth-lead').textContent=login?'Enter your memory code and PIN to return to your Companion.':'Create a personal memory code and PIN. Keep them safe so you can return to your memories.';authStatus.textContent=''}
function render(){const logged=!!session;authView.classList.toggle('hidden',logged);chatView.classList.toggle('hidden',!logged);$('account-button').classList.toggle('hidden',!logged);$('top-subtitle').textContent=logged?'我在这里，听你慢慢说':'A private space to feel heard';if(logged){$('account-code').textContent=session.user.user_metadata?.identity_type==='memory_code'?'Personal memory account':'Private account';authStatus.textContent=''}}
async function setup(){try{const r=await fetch('/api/companion-config',{cache:'no-store'});const cfg=await r.json();if(!r.ok||!cfg.url||!cfg.anonKey||!window.supabase){authStatus.textContent=cfg.error||'账户服务暂时不可用，请稍后再试。';$('login-button').disabled=true;$('register-button').disabled=true;return}client=window.supabase.createClient(cfg.url,cfg.anonKey);const {data}=await client.auth.getSession();session=data.session;client.auth.onAuthStateChange((_event,next)=>{session=next;render();if(session)loadHistory()});render();if(session)await loadHistory()}catch(e){authStatus.textContent='连接失败，请稍后重试。'}}
async function login(){if(!client)return;const code=$('login-code').value,pin=$('login-pin').value;if(!validCode(code)||pin.length<8){authStatus.textContent='Enter your full memory code and PIN (at least 8 characters).';return}const b=$('login-button');b.disabled=true;authStatus.textContent='正在进入你的私人空间……';try{const {data,error}=await client.auth.signInWithPassword({email:emailForCode(code),password:pin});if(error)throw error;session=data.session;render();await loadHistory()}catch(e){authStatus.textContent='无法验证代码和 PIN，请检查后重试。'}finally{b.disabled=false}}
async function register(){if(!client)return;const code=generatedCode||$('new-code').textContent,pin=$('register-pin').value,confirmPin=$('register-pin-confirm').value;if(!validCode(code)){authStatus.textContent='请先生成 Memory Code。';return}if(pin.length<8){authStatus.textContent='PIN 至少需要 8 个字符。';return}if(pin!==confirmPin){authStatus.textContent='两次输入的 PIN 不一致。';return}const b=$('register-button');b.disabled=true;authStatus.textContent='正在创建你的私人空间……';try{const {data,error}=await client.auth.signUp({email:emailForCode(code),password:pin,options:{data:{identity_type:'memory_code'}}});if(error)throw error;if(!data.session){authStatus.textContent='Account created, but automatic sign-in is disabled. The administrator needs to turn off email confirmation for memory-code accounts.';return}session=data.session;render();await loadHistory();chatStatus.textContent='私人空间已准备好。'}catch(e){authStatus.textContent=e.message||'Could not create your account. Please try again.'}finally{b.disabled=false}}
async function api(action,body){if(!session)throw new Error('Your session expired. Please log in again.');const r=await fetch('/api/companion-chat',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({action,...(body||{})})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Request failed.');return d}
function bubble(content,role){const el=document.createElement('div');el.className='bubble '+(role==='user'?'user':'ai');el.textContent=content;$('messages').appendChild(el);$('messages').scrollTop=$('messages').scrollHeight;return el}
async function loadHistory(){if(!session)return;try{const d=await api('history');$('messages').replaceChildren();if(!d.messages?.length)bubble("你好，很高兴你来了。今天有什么想聊聊的？",'ai');else d.messages.forEach(m=>bubble(m.content,m.role));$('messages').scrollTop=$('messages').scrollHeight}catch(e){chatStatus.textContent=e.message}}
async function send(e){e.preventDefault();if(busy||!session)return;const input=$('message'),content=input.value.trim();if(!content)return;busy=true;$('send').disabled=true;input.value='';input.style.height='auto';bubble(content,'user');const loading=bubble('正在思考……','ai');chatStatus.textContent='';try{const d=await api('chat',{message:content});loading.textContent=d.reply}catch(err){loading.textContent='I’m sorry, I could not reply just now. '+err.message}finally{busy=false;$('send').disabled=false;input.focus()}}
$('login-tab').addEventListener('click',()=>setTab('login'));$('register-tab').addEventListener('click',()=>setTab('register'));$('generate-code').addEventListener('click',generate);$('copy-code').addEventListener('click',async()=>{if(!generatedCode){authStatus.textContent='请先生成 Memory Code。';return}try{await navigator.clipboard.writeText(generatedCode);authStatus.textContent='代码已复制，请妥善保存。'}catch(e){authStatus.textContent='请手动选择并复制代码。'}});$('login-button').addEventListener('click',login);$('register-button').addEventListener('click',register);$('chat-form').addEventListener('submit',send);$('message').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!$('send').disabled)$('chat-form').requestSubmit()}});$('message').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,120)+'px'});$('account-button').addEventListener('click',()=>$('account-sheet').classList.remove('hidden'));$('close-sheet').addEventListener('click',()=>$('account-sheet').classList.add('hidden'));$('account-sheet').addEventListener('click',e=>{if(e.target===$('account-sheet'))$('account-sheet').classList.add('hidden')});$('signout').addEventListener('click',async()=>{if(client)await client.auth.signOut();session=null;$('account-sheet').classList.add('hidden');$('messages').replaceChildren();setTab('login');render()});if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/companion-sw.js').catch(()=>{}))}
setup();
})();
</script>
</body>
</html>
